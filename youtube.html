<!DOCTYPE html><html><head><style>html, body {
        width: 100%;
        height: 100%;
    }
    body {
        margin: 0;
        padding: 0;
        background-color: black;
        overflow: hidden;
    }
    #player {
        width: 100%;
        height: 100%;
    }</style><body><div id=player></div><script>function getQueryParams(qs) {
        qs = qs.split('+').join(' ');

        var params = {},
            tokens,
            re = /[?&]?([^=]+)=([^&]*)/g;

        while (tokens = re.exec(qs)) {
            params[decodeURIComponent(tokens[1])] = decodeURIComponent(tokens[2]);
        }

        return params;
    }

    var query = getQueryParams(document.location.search);

    var MEDIAPLAYER_VIDEO_ID = query.v || '5fSH8shWo_U',
        MEDIAPLAYER_START_SEC = query.start ? parseInt(query.start, 10) : undefined;

    var tag = document.createElement('script');

    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    var player;
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            videoId: MEDIAPLAYER_VIDEO_ID,
            startSeconds: MEDIAPLAYER_START_SEC,
            playerVars: {
                autoplay: 1,
                controls: 0,
                cc_load_policy: 1,
                disablekb: 1,
                modestbranding: 1,
                rel: 0,
                showinfo: 0
            },
            events: {
                'onReady': onPlayerReady
            }
        });
    }

    function onPlayerReady() {
        console.log("Player Ready");
        player.playVideo();
    }
;</script>
